<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Dashboard</title>

    <!-- iOS & Android Full-Screen Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Family Dash">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">

    <!-- Embedded App Icon (SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text y='68' x='50' text-anchor='middle' font-size='55'>⛅</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text y='68' x='50' text-anchor='middle' font-size='55'>⛅</text></svg>">

    <!-- Embedded PWA Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"HK Family Dashboard","short_name":"Dashboard","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","orientation":"landscape"}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+HK:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans HK', sans-serif;
            background-color: #0f172a;
            /* Strictly prevent scrolling on the entire page */
            overflow: hidden; 
            margin: 0;
            padding: 0;
            /* Disable pull-to-refresh and touch highlights on tablets */
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .alert-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .alert-panel.has-warning {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth scaling for the embedded Google Calendar */
        #gcal-embed-iframe {
            transform-origin: 0 0;
            transition: transform 0.2s ease, width 0.2s ease, height 0.2s ease;
        }

        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen p-2.5 flex gap-2.5 bg-gradient-to-br from-slate-900 via-gray-900 to-black text-slate-100">

    <!-- Left Column: Clock, Weather, Alerts & Forecast (38% width to maximize right pane) -->
    <div class="flex flex-col w-[38%] h-full gap-2.5">
        
        <!-- Top Section: Location, 24hr Time with Seconds, English Date Only -->
        <div class="glass-panel rounded-2xl px-4 py-3 flex flex-col justify-between h-[28%]">
            <div class="flex items-center justify-between gap-1">
                <div class="flex items-center gap-1.5 text-slate-300 text-xs md:text-sm font-medium truncate">
                    <i class="fa-solid fa-location-dot text-blue-400 shrink-0"></i>
                    <span class="truncate">Tiu Keng Leng, HK <span class="text-slate-400">(調景嶺)</span></span>
                </div>
                <span id="weather-sync-status" class="text-[10px] text-slate-500 font-mono shrink-0">Syncing...</span>
            </div>
            
            <!-- Live Clock in 24hr Format with Seconds (Scaled to fit narrower pane) -->
            <div id="clock-time" class="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight text-white leading-none my-0.5 font-mono">
                --:--:--
            </div>
            
            <!-- English Date Only -->
            <div class="text-base md:text-lg text-slate-300 font-medium flex items-center truncate">
                <span id="clock-date-en">Loading date...</span>
            </div>
        </div>

        <!-- Current Weather Section -->
        <div class="glass-panel rounded-2xl px-4 py-2.5 flex items-center justify-between h-[21%]">
            <div class="flex items-center gap-2">
                <span id="weather-temp" class="text-4xl sm:text-5xl lg:text-6xl font-bold text-white tracking-tighter drop-shadow-md">--°C</span>
            </div>
            <div class="flex items-center gap-3">
                <i id="weather-icon" class="fa-solid fa-spinner fa-spin text-3xl md:text-4xl text-blue-400 drop-shadow-lg shrink-0"></i>
                <div class="text-slate-300 font-medium leading-tight border-l border-slate-600 pl-3 flex flex-col items-start gap-1.5">
                    <div id="weather-details-en" class="text-sm md:text-base font-semibold text-slate-200 whitespace-nowrap">Humidity: --%</div>
                    <!-- Live Rain Probability Pill Badge -->
                    <div class="flex items-center gap-1.5 text-xs md:text-sm text-cyan-300 font-semibold bg-slate-800/90 px-2.5 py-0.5 rounded-full border border-cyan-500/40 shadow-sm" title="Current Precipitation Probability">
                        <i class="fa-solid fa-umbrella text-cyan-400 text-xs"></i>
                        <span id="curr-pop-badge">--%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Compact Weather Alert Banner -->
        <div id="alert-container" class="alert-panel rounded-xl px-3.5 py-1.5 flex items-center justify-between gap-2 h-[11%]">
            <div class="flex items-center gap-1.5 text-slate-300 font-semibold text-xs md:text-sm uppercase tracking-wider shrink-0">
                <i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i>
                <span>Weather Warnings</span>
            </div>
            
            <!-- Dynamic Alert Icons List -->
            <div id="alert-icons-list" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-1.5 text-slate-400 text-xs font-normal bg-slate-800/60 px-2.5 py-1 rounded-lg border border-slate-700/50 whitespace-nowrap">
                    <i class="fa-solid fa-shield-halved text-emerald-400 text-xs"></i>
                    <span>No active warnings</span>
                </div>
            </div>
        </div>

        <!-- Forecast Section (3 Cards Grid: Afternoon 12:00, Night 18:00, Tomorrow 08:00) -->
        <div class="h-[40%] flex flex-col justify-end min-h-0">
            <div class="flex items-center justify-between mb-1 px-1 shrink-0">
                <div class="text-slate-400 font-bold uppercase tracking-wider text-xs md:text-sm flex items-center gap-2">
                    <span>Forecast 天氣預報</span>
                    <span id="precip-source-badge" class="text-[10px] font-normal text-cyan-400/90 bg-slate-800/80 px-1.5 py-0.5 rounded border border-slate-700">15m Sync</span>
                </div>
            </div>
            <div id="forecast-grid" class="flex-1 grid grid-cols-3 gap-2 min-h-0">
                
                <!-- Card 1: Afternoon 12:00 (今午) - Hides when time >= 12:00 -->
                <div id="card-aft" class="glass-panel rounded-xl flex flex-col items-center justify-between text-center p-2 transition-opacity duration-300 min-h-0">
                    <div id="f1-date" class="text-slate-200 font-semibold text-[11px] border-b border-slate-700/60 pb-0.5 w-full truncate">
                        <span id="f1-ddmmm" class="text-blue-400 font-bold mr-0.5">--</span>12:00
                    </div>
                    
                    <div class="my-0.5 flex items-center justify-center">
                        <i id="f1-icon" class="fa-solid fa-sun text-xl md:text-2xl text-yellow-400 drop-shadow"></i>
                    </div>

                    <div id="f1-temp" class="text-base md:text-lg font-bold text-white leading-tight">
                        --°C
                    </div>

                    <div id="f1-rh" class="text-[11px] font-medium text-slate-300 leading-tight">
                        --% RH
                    </div>

                    <div class="flex items-center gap-1 text-[11px] text-cyan-300 font-medium bg-slate-800/80 px-2 py-0.5 rounded-full border border-slate-700/60">
                        <i class="fa-solid fa-umbrella text-cyan-400 text-[10px]"></i>
                        <span id="f1-psr">--%</span>
                    </div>
                </div>

                <!-- Card 2: Night 18:00 (今晚) - Hides when time >= 18:00 -->
                <div id="card-night" class="glass-panel rounded-xl flex flex-col items-center justify-between text-center p-2 transition-opacity duration-300 min-h-0">
                    <div id="f2-date" class="text-slate-200 font-semibold text-[11px] border-b border-slate-700/60 pb-0.5 w-full truncate">
                        <span id="f2-ddmmm" class="text-indigo-400 font-bold mr-0.5">--</span>18:00
                    </div>
                    
                    <div class="my-0.5 flex items-center justify-center">
                        <i id="f2-icon" class="fa-solid fa-cloud-moon text-xl md:text-2xl text-indigo-300 drop-shadow"></i>
                    </div>

                    <div id="f2-temp" class="text-base md:text-lg font-bold text-white leading-tight">
                        --°C
                    </div>

                    <div id="f2-rh" class="text-[11px] font-medium text-slate-300 leading-tight">
                        --% RH
                    </div>

                    <div class="flex items-center gap-1 text-[11px] text-cyan-300 font-medium bg-slate-800/80 px-2 py-0.5 rounded-full border border-slate-700/60">
                        <i class="fa-solid fa-umbrella text-cyan-400 text-[10px]"></i>
                        <span id="f2-psr">--%</span>
                    </div>
                </div>

                <!-- Card 3: Tomorrow 08:00 (明日) -->
                <div id="card-tmr" class="glass-panel rounded-xl flex flex-col items-center justify-between text-center p-2 transition-opacity duration-300 min-h-0">
                    <div id="f3-date" class="text-slate-200 font-semibold text-[11px] border-b border-slate-700/60 pb-0.5 w-full truncate">
                        <span id="f3-ddmmm" class="text-emerald-400 font-bold mr-0.5">--</span>08:00
                    </div>
                    
                    <div class="my-0.5 flex items-center justify-center">
                        <i id="f3-icon" class="fa-solid fa-cloud-sun text-xl md:text-2xl text-yellow-300 drop-shadow"></i>
                    </div>

                    <div id="f3-temp" class="text-base md:text-lg font-bold text-white leading-tight">
                        --°C
                    </div>

                    <div id="f3-rh" class="text-[11px] font-medium text-slate-300 leading-tight">
                        --% RH
                    </div>

                    <div class="flex items-center gap-1 text-[11px] text-cyan-300 font-medium bg-slate-800/80 px-2 py-0.5 rounded-full border border-slate-700/60">
                        <i class="fa-solid fa-umbrella text-cyan-400 text-[10px]"></i>
                        <span id="f3-psr">--%</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Right Column: Upcoming Events Schedule - Maximized Area (62% width) -->
    <div class="glass-panel w-[62%] h-full rounded-2xl p-3.5 flex flex-col">
        <!-- Compact Single-Row Header for Upcoming Events -->
        <div class="border-b border-slate-600/50 pb-2 mb-2.5 shrink-0 flex items-center justify-between gap-2">
            <div class="flex items-baseline gap-2.5 truncate">
                <h2 class="text-lg md:text-xl font-bold text-white tracking-wide uppercase whitespace-nowrap">Upcoming Events</h2>
                <h3 class="text-xs md:text-sm text-slate-400 font-medium truncate">Calendar Schedule 行程表</h3>
            </div>
            
            <!-- Controls: Dynamic Font Size Adjustment (100% - 250%) + Embed Refresh -->
            <div class="flex items-center gap-1.5 shrink-0">
                <!-- Text Size Adjustment Buttons -->
                <div class="flex items-center bg-slate-800/90 rounded-lg border border-slate-600 overflow-hidden shadow-sm">
                    <button onclick="adjustEventTextSize(-1)" title="Decrease Calendar Font Size" class="px-2.5 py-1 text-xs text-slate-200 hover:text-white hover:bg-slate-700 active:bg-slate-600 font-bold transition border-r border-slate-700">
                        A-
                    </button>
                    <span id="font-size-indicator" class="px-2 text-xs text-cyan-300 font-mono font-semibold select-none min-w-[44px] text-center">100%</span>
                    <button onclick="adjustEventTextSize(1)" title="Increase Calendar Font Size" class="px-2.5 py-1 text-xs text-slate-200 hover:text-white hover:bg-slate-700 active:bg-slate-600 font-bold transition border-l border-slate-700">
                        A+
                    </button>
                </div>

                <button onclick="refreshEmbedCalendar()" id="calendar-sync-status" class="text-xs text-slate-300 hover:text-white font-mono bg-slate-800/80 hover:bg-slate-700 px-2.5 py-1 rounded-lg border border-slate-600 transition flex items-center gap-1.5">
                    <i id="cal-refresh-icon" class="fa-solid fa-rotate"></i>
                    <span id="cal-status-text">Live</span>
                </button>
            </div>
        </div>

        <!-- Direct Google Calendar Agenda Embed View (Exclusively Shown) -->
        <div id="embed-schedule-container" class="flex-1 rounded-xl overflow-hidden border border-slate-700/60 bg-slate-900 relative">
            <iframe 
                id="gcal-embed-iframe"
                src="https://calendar.google.com/calendar/embed?src=s73ta3ckuda0ka3jkc4n7ujdtk%40group.calendar.google.com&ctz=Asia%2FHong_Kong&mode=AGENDA&showTitle=0&showNav=0&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0"
                class="border-0"
                style="filter: invert(92%) hue-rotate(180deg) contrast(90%); width: 100%; height: 100%;"
                frameborder="0" 
                scrolling="yes">
            </iframe>
        </div>
    </div>

    <script>
        const CALENDAR_ID = 's73ta3ckuda0ka3jkc4n7ujdtk@group.calendar.google.com';
        const EMBED_BASE_URL = `https://calendar.google.com/calendar/embed?src=${encodeURIComponent(CALENDAR_ID)}&ctz=Asia%2FHong_Kong&mode=AGENDA&showTitle=0&showNav=0&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0`;
        
        // Tiu Keng Leng / Tseung Kwan O Coordinates
        const LAT = 22.3080;
        const LON = 114.2600;
        const WEATHER_COM_URL = `https://weather.com/en-HK/weather/hourbyhour/l/${LAT},${LON}`;

        // --- Dynamic Font Size Adjustment for Embedded Calendar (100% to 250%) ---
        const scaleLevels = [
            { scale: 1.00, label: '100%' },
            { scale: 1.15, label: '115%' },
            { scale: 1.25, label: '125%' },
            { scale: 1.50, label: '150%' },
            { scale: 1.75, label: '175%' },
            { scale: 2.00, label: '200%' },
            { scale: 2.25, label: '225%' },
            { scale: 2.50, label: '250%' }
        ];
        let currentSizeIndex = parseInt(localStorage.getItem('family_dash_embed_scale_100_250') || '0', 10); // Default 100% (index 0)

        function applyEventTextSize() {
            if (isNaN(currentSizeIndex) || currentSizeIndex < 0) currentSizeIndex = 0;
            if (currentSizeIndex >= scaleLevels.length) currentSizeIndex = scaleLevels.length - 1;
            localStorage.setItem('family_dash_embed_scale_100_250', currentSizeIndex);

            const { scale, label } = scaleLevels[currentSizeIndex];
            document.getElementById('font-size-indicator').textContent = label;

            const iframe = document.getElementById('gcal-embed-iframe');
            if (iframe) {
                iframe.style.transform = `scale(${scale})`;
                iframe.style.width = `${(100 / scale).toFixed(4)}%`;
                iframe.style.height = `${(100 / scale).toFixed(4)}%`;
            }
        }

        function adjustEventTextSize(direction) {
            currentSizeIndex += direction;
            applyEventTextSize();
        }

        function refreshEmbedCalendar() {
            const iframe = document.getElementById('gcal-embed-iframe');
            const icon = document.getElementById('cal-refresh-icon');
            const statusText = document.getElementById('cal-status-text');
            if (iframe) {
                icon.classList.add('fa-spin');
                statusText.textContent = 'Sync...';
                iframe.src = `${EMBED_BASE_URL}&_cb=${Date.now()}`;
                setTimeout(() => {
                    icon.classList.remove('fa-spin');
                    const now = new Date();
                    statusText.textContent = `${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Hong_Kong' })}`;
                }, 1200);
            }
        }

        function formatDDMMM(dateObj) {
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Hong_Kong',
                day: '2-digit',
                month: 'short'
            }).formatToParts(dateObj);
            const dd = parts.find(p => p.type === 'day').value;
            const mmm = parts.find(p => p.type === 'month').value.toUpperCase();
            return `${dd}${mmm}`;
        }

        function toHKDateKey(dateObj) {
            return dateObj.toLocaleDateString('en-CA', { timeZone: 'Asia/Hong_Kong' });
        }

        function getWmoIcon(code, isNight = false) {
            if (code === 0) return isNight ? 'fa-moon text-indigo-200' : 'fa-sun text-yellow-400';
            if (code >= 1 && code <= 3) return isNight ? 'fa-cloud-moon text-indigo-300' : 'fa-cloud-sun text-yellow-300';
            if (code >= 45 && code <= 48) return 'fa-smog text-slate-400';
            if (code >= 51 && code <= 57) return 'fa-cloud-rain text-blue-300';
            if (code >= 61 && code <= 67) return 'fa-cloud-rain text-blue-400';
            if (code >= 80 && code <= 82) return 'fa-cloud-showers-heavy text-blue-400';
            if (code >= 95) return 'fa-cloud-bolt text-amber-400';
            return isNight ? 'fa-cloud-moon text-indigo-300' : 'fa-cloud-sun text-yellow-400';
        }

        // --- Live Clock & Date Labels ---
        function updateClock() {
            const now = new Date();
            
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Hong_Kong' };
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-GB', timeOptions);

            const dateOptionsEN = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'Asia/Hong_Kong' };
            document.getElementById('clock-date-en').textContent = now.toLocaleDateString('en-US', dateOptionsEN);

            const tmr = new Date(now.getTime() + 86400000);
            document.getElementById('f1-ddmmm').textContent = formatDDMMM(now);
            document.getElementById('f2-ddmmm').textContent = formatDDMMM(now);
            document.getElementById('f3-ddmmm').textContent = formatDDMMM(tmr);
        }

        updateClock();
        setInterval(updateClock, 1000);

        function getFontAwesomeIcon(hkoIconCode) {
            const iconMap = {
                50: 'fa-sun text-yellow-400', 51: 'fa-cloud-sun text-yellow-300', 52: 'fa-cloud-sun-rain text-yellow-200',
                53: 'fa-cloud-showers-heavy text-blue-400', 54: 'fa-cloud-showers-heavy text-blue-500', 60: 'fa-cloud text-slate-300',
                61: 'fa-cloud text-slate-400', 62: 'fa-cloud-rain text-blue-400', 63: 'fa-cloud-showers-heavy text-blue-400',
                64: 'fa-cloud-bolt text-amber-400', 65: 'fa-cloud-bolt text-amber-500', 70: 'fa-moon text-indigo-200',
                71: 'fa-cloud-moon text-indigo-300', 72: 'fa-cloud-moon-rain text-indigo-300', 73: 'fa-cloud-moon-rain text-indigo-400',
                74: 'fa-cloud-moon-rain text-indigo-400', 75: 'fa-cloud-moon text-indigo-300', 76: 'fa-cloud text-slate-300',
                77: 'fa-cloud text-slate-400', 80: 'fa-wind text-cyan-300', 81: 'fa-droplet text-blue-300',
                82: 'fa-smog text-slate-400', 83: 'fa-smog text-slate-400', 84: 'fa-smog text-slate-400', 85: 'fa-snowflake text-cyan-200',
                90: 'fa-temperature-arrow-up text-red-400', 91: 'fa-temperature-arrow-down text-blue-300', 92: 'fa-temperature-low text-blue-400'
            };
            return iconMap[hkoIconCode] || 'fa-cloud-sun text-yellow-400';
        }

        const hkoWarningIconMap = {
            'WFIREY': 'https://www.hko.gov.hk/textonly/v2/images/wfiry.gif',  
            'WFIRER': 'https://www.hko.gov.hk/textonly/v2/images/wfirr.gif',  
            'WRAINA': 'https://www.hko.gov.hk/textonly/v2/images/wraina.gif', 
            'WRAINR': 'https://www.hko.gov.hk/textonly/v2/images/wrainr.gif', 
            'WRAINB': 'https://www.hko.gov.hk/textonly/v2/images/wrainb.gif', 
            'WTS':    'https://www.hko.gov.hk/textonly/v2/images/ts.gif',     
            'TC1':    'https://www.hko.gov.hk/textonly/v2/images/tc1.gif',    
            'TC3':    'https://www.hko.gov.hk/textonly/v2/images/tc3.gif',    
            'TC8NE':  'https://www.hko.gov.hk/textonly/v2/images/tc8ne.gif',  
            'TC8SE':  'https://www.hko.gov.hk/textonly/v2/images/tc8se.gif',  
            'TC8NW':  'https://www.hko.gov.hk/textonly/v2/images/tc8nw.gif',  
            'TC8SW':  'https://www.hko.gov.hk/textonly/v2/images/tc8sw.gif',  
            'TC9':    'https://www.hko.gov.hk/textonly/v2/images/tc9.gif',    
            'TC10':   'https://www.hko.gov.hk/textonly/v2/images/tc10.gif',   
            'WCOLD':  'https://www.hko.gov.hk/textonly/v2/images/cold.gif',   
            'WHOT':   'https://www.hko.gov.hk/textonly/v2/images/vhot.gif',   
            'WMS':    'https://www.hko.gov.hk/textonly/v2/images/sms.gif',    
            'WLAND':  'https://www.hko.gov.hk/textonly/v2/images/landslip.gif',
            'FROST':  'https://www.hko.gov.hk/textonly/v2/images/frost.gif'   
        };

        function getFallbackBadge(code, name) {
            const codeUpper = (code || '').toUpperCase();
            if (codeUpper.includes('FIREY')) return `<div class="bg-yellow-500/20 text-yellow-300 text-xs font-bold px-2 py-0.5 rounded-lg border border-yellow-400 flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-fire text-yellow-400"></i><span>Yellow Fire</span></div>`;
            if (codeUpper.includes('FIRER')) return `<div class="bg-red-500/20 text-red-300 text-xs font-bold px-2 py-0.5 rounded-lg border border-red-500 flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-fire-flame-curved text-red-400"></i><span>Red Fire</span></div>`;
            if (codeUpper.includes('RAINA')) return `<div class="bg-amber-500/20 text-amber-300 text-xs font-bold px-2 py-0.5 rounded-lg border border-amber-400 flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-cloud-showers-heavy text-amber-400"></i><span>Amber Rain</span></div>`;
            if (codeUpper.includes('RAINR')) return `<div class="bg-red-600/30 text-red-200 text-xs font-bold px-2 py-0.5 rounded-lg border border-red-500 flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-cloud-showers-water text-red-400"></i><span>Red Rain</span></div>`;
            if (codeUpper.includes('RAINB')) return `<div class="bg-slate-900 text-slate-100 text-xs font-bold px-2 py-0.5 rounded-lg border border-slate-500 flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-cloud-showers-heavy text-white"></i><span>Black Rain</span></div>`;
            if (codeUpper.includes('TS')) return `<div class="bg-amber-500/20 text-amber-300 text-xs font-bold px-2 py-0.5 rounded-lg border border-amber-400 flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-bolt text-yellow-300"></i><span>Thunderstorm</span></div>`;
            if (codeUpper.includes('TC')) return `<div class="bg-red-500/20 text-red-300 text-xs font-bold px-2 py-0.5 rounded-lg border border-red-400 flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-hurricane text-red-400"></i><span>${name || 'Typhoon'}</span></div>`;
            return `<div class="bg-amber-500/20 text-amber-300 text-xs font-bold px-2 py-0.5 rounded-lg border border-amber-500/50 flex items-center gap-1 whitespace-nowrap"><i class="fa-solid fa-triangle-exclamation text-amber-400"></i><span>${name || code}</span></div>`;
        }

        function renderWarningBadge(code, name) {
            let imgUrl = hkoWarningIconMap[code];
            const safeName = (name || '').replace(/'/g, "\\'");
            if (imgUrl) {
                return `<img src="${imgUrl}" alt="${name}" title="${name}" referrerpolicy="no-referrer" onerror="this.outerHTML=getFallbackBadge('${code}', '${safeName}')" class="h-7 md:h-8 object-contain rounded border border-amber-400/40 bg-slate-900/60 p-0.5 shadow-sm">`;
            }
            return getFallbackBadge(code, name);
        }

        // Helper to fetch raw HTML through resilient CORS proxies with timeout
        async function fetchHtmlViaProxies(targetUrl) {
            const fetchWithTimeout = (url, ms = 6000) => {
                const ctrl = new AbortController();
                const id = setTimeout(() => ctrl.abort(), ms);
                return fetch(url, { signal: ctrl.signal, cache: 'no-store' }).finally(() => clearTimeout(id));
            };

            const proxies = [
                async () => {
                    const r = await fetchWithTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
                    if (!r.ok) throw new Error('allorigins raw failed');
                    return await r.text();
                },
                async () => {
                    const r = await fetchWithTimeout(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`);
                    if (!r.ok) throw new Error('codetabs failed');
                    return await r.text();
                },
                async () => {
                    const r = await fetchWithTimeout(`https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`);
                    if (!r.ok) throw new Error('corsproxy failed');
                    return await r.text();
                }
            ];

            for (const proxyFn of proxies) {
                try {
                    const html = await proxyFn();
                    if (html && html.length > 1000) return html;
                } catch (e) {}
            }
            return null;
        }

        // Enhanced Weather.com parser: handles both escaped & unescaped embedded JSON state
        async function fetchWeatherComHourly() {
            try {
                const rawHtml = await fetchHtmlViaProxies(WEATHER_COM_URL);
                if (!rawHtml) return null;

                const html = rawHtml.replace(/\\"/g, '"');

                const popMatches = [...html.matchAll(/"precipPct"\s*:\s*\[([^\]]+)\]/g)];
                const tempMatches = [...html.matchAll(/"temperature"\s*:\s*\[([^\]]+)\]/g)];
                const rhMatches = [...html.matchAll(/"relativeHumidity"\s*:\s*\[([^\]]+)\]/g)];
                const timeMatches = [...html.matchAll(/"validTimeLocal"\s*:\s*\[([^\]]+)\]/g)];

                if (popMatches.length > 0 && timeMatches.length > 0) {
                    for (let mIdx = 0; mIdx < timeMatches.length; mIdx++) {
                        try {
                            const times = JSON.parse(`[${timeMatches[mIdx][1]}]`);
                            const pops = JSON.parse(`[${(popMatches[mIdx] || popMatches[0])[1]}]`);
                            const temps = tempMatches[mIdx] ? JSON.parse(`[${tempMatches[mIdx][1]}]`) : (tempMatches[0] ? JSON.parse(`[${tempMatches[0][1]}]`) : []);
                            const rhs = rhMatches[mIdx] ? JSON.parse(`[${rhMatches[mIdx][1]}]`) : (rhMatches[0] ? JSON.parse(`[${rhMatches[0][1]}]`) : []);

                            if (times.length > 2) {
                                const hourlyMap = {};
                                times.forEach((tStr, i) => {
                                    if (typeof tStr === 'string' && tStr.length >= 16) {
                                        const hourKey = tStr.substring(0, 13);   // YYYY-MM-DDTHH
                                        const minKey  = tStr.substring(0, 16);   // YYYY-MM-DDTHH:mm
                                        const entry = {
                                            pop: pops[i] != null ? Number(pops[i]) : null,
                                            temp: temps[i] != null ? Number(temps[i]) : null,
                                            rh: rhs[i] != null ? Number(rhs[i]) : null
                                        };
                                        hourlyMap[minKey] = entry;
                                        if (!hourlyMap[hourKey]) hourlyMap[hourKey] = entry;
                                    }
                                });
                                if (Object.keys(hourlyMap).length > 0) return hourlyMap;
                            }
                        } catch (e) {}
                    }
                }
            } catch (err) {}
            return null;
        }

        async function fetchWeatherData() {
            const syncStatusEl = document.getElementById('weather-sync-status');
            const badgeEl = document.getElementById('precip-source-badge');
            try {
                syncStatusEl.textContent = 'Syncing...';

                // Fetch HKO Warnings/Temp + High-Res 15-Minute & Hourly Forecast + Weather.com Direct Feed
                const openMeteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,is_day&minutely_15=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&timezone=Asia%2FHong_Kong&forecast_days=3`;

                const [rhrEnRes, warnSumRes, openMeteoRes, weatherComMap] = await Promise.all([
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en', { cache: 'no-store' }).catch(() => null),
                    fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en', { cache: 'no-store' }).catch(() => null),
                    fetch(openMeteoUrl, { cache: 'no-store' }),
                    fetchWeatherComHourly()
                ]);

                let rhrEn = {};
                if (rhrEnRes && rhrEnRes.ok) { try { rhrEn = await rhrEnRes.json(); } catch(e){} }
                let warnSum = {};
                if (warnSumRes && warnSumRes.ok) { try { warnSum = await warnSumRes.json(); } catch(e){} }
                const omData = await openMeteoRes.json();

                if (badgeEl) {
                    badgeEl.textContent = weatherComMap ? 'Weather.com Live' : '15-Min High-Res';
                }

                const now = new Date();
                const currentHour = parseInt(now.toLocaleTimeString('en-GB', { hour: '2-digit', hour12: false, timeZone: 'Asia/Hong_Kong' }), 10);
                const currentMin = parseInt(now.toLocaleTimeString('en-GB', { minute: '2-digit', hour12: false, timeZone: 'Asia/Hong_Kong' }), 10);
                const roundedQuarter = String(Math.floor(currentMin / 15) * 15).padStart(2, '0');

                const hourlyTimes = omData.hourly && omData.hourly.time ? omData.hourly.time : [];
                const min15Times = omData.minutely_15 && omData.minutely_15.time ? omData.minutely_15.time : [];

                // Helper to get exact 15-min or hourly slot for any target hour & minute
                const getSlotData = (targetHour, targetMin = '00', dayOffset = 0) => {
                    const d = new Date(now.getTime() + dayOffset * 86400000);
                    const datePart = toHKDateKey(d);
                    const hh = String(targetHour).padStart(2, '0');
                    const mm = String(targetMin).padStart(2, '0');

                    const hourKey = `${datePart}T${hh}`;
                    const exactTimeStr = `${datePart}T${hh}:${mm}`;

                    // 1. Check Weather.com parsed map first
                    const wcEntry = weatherComMap ? (weatherComMap[exactTimeStr] || weatherComMap[hourKey]) : null;

                    // 2. Check 15-minute high-resolution array (matches 10:45, 11:00, 12:00 etc.)
                    const m15Idx = min15Times.indexOf(exactTimeStr);
                    const hrIdx = hourlyTimes.indexOf(`${hourKey}:00`);
                    const safeHrIdx = hrIdx !== -1 ? hrIdx : (dayOffset * 24 + targetHour);

                    const m15Temp = (m15Idx !== -1 && omData.minutely_15.temperature_2m) ? omData.minutely_15.temperature_2m[m15Idx] : null;
                    const m15Rh   = (m15Idx !== -1 && omData.minutely_15.relative_humidity_2m) ? omData.minutely_15.relative_humidity_2m[m15Idx] : null;
                    const m15Pop  = (m15Idx !== -1 && omData.minutely_15.precipitation_probability) ? omData.minutely_15.precipitation_probability[m15Idx] : null;
                    const m15Wmo  = (m15Idx !== -1 && omData.minutely_15.weather_code) ? omData.minutely_15.weather_code[m15Idx] : null;

                    const hrTemp = (omData.hourly && omData.hourly.temperature_2m) ? omData.hourly.temperature_2m[safeHrIdx] : null;
                    const hrRh   = (omData.hourly && omData.hourly.relative_humidity_2m) ? omData.hourly.relative_humidity_2m[safeHrIdx] : null;
                    const hrPop  = (omData.hourly && omData.hourly.precipitation_probability) ? omData.hourly.precipitation_probability[safeHrIdx] : null;
                    const hrWmo  = (omData.hourly && omData.hourly.weather_code) ? omData.hourly.weather_code[safeHrIdx] : 1;

                    const temp = (wcEntry && wcEntry.temp != null) ? Math.round(wcEntry.temp)
                               : (m15Temp != null ? Math.round(m15Temp) : (hrTemp != null ? Math.round(hrTemp) : '--'));

                    const rh = (wcEntry && wcEntry.rh != null) ? Math.round(wcEntry.rh)
                             : (m15Rh != null ? Math.round(m15Rh) : (hrRh != null ? Math.round(hrRh) : '--'));

                    const pop = (wcEntry && wcEntry.pop != null) ? Math.round(wcEntry.pop)
                              : (m15Pop != null ? Math.round(m15Pop) : (hrPop != null ? Math.round(hrPop) : 0));

                    const wmoCode = m15Wmo != null ? m15Wmo : hrWmo;

                    return { temp, rh, pop, wmoCode };
                };

                // --- 1. Current Weather Panel (Matches Current 15-min slot) ---
                const currMetrics = getSlotData(currentHour, roundedQuarter, 0);

                let displayCurrTemp = currMetrics.temp;
                if (displayCurrTemp === '--' && rhrEn.temperature && rhrEn.temperature.data) {
                    const tkoObj = rhrEn.temperature.data.find(item => item.place === 'Tseung Kwan O') || rhrEn.temperature.data[0];
                    if (tkoObj) displayCurrTemp = tkoObj.value;
                }
                document.getElementById('weather-temp').textContent = `${displayCurrTemp}°C`;

                const displayCurrRh = currMetrics.rh !== '--' ? currMetrics.rh
                    : (omData.current && omData.current.relative_humidity_2m != null ? Math.round(omData.current.relative_humidity_2m) : '--');
                document.getElementById('weather-details-en').textContent = `Humidity: ${displayCurrRh}%`;

                document.getElementById('curr-pop-badge').textContent = `${currMetrics.pop}%`;

                if (rhrEn.icon && rhrEn.icon.length > 0) {
                    document.getElementById('weather-icon').className = `fa-solid ${getFontAwesomeIcon(rhrEn.icon[0])} text-3xl md:text-4xl drop-shadow-lg shrink-0`;
                } else {
                    const isNightNow = currentHour < 6 || currentHour >= 18;
                    document.getElementById('weather-icon').className = `fa-solid ${getWmoIcon(currMetrics.wmoCode, isNightNow)} text-3xl md:text-4xl drop-shadow-lg shrink-0`;
                }

                // --- 2. Weather Warnings Banner ---
                const alertContainer = document.getElementById('alert-container');
                const alertIconsList = document.getElementById('alert-icons-list');
                const activeBadges = [];

                if (warnSum && typeof warnSum === 'object') {
                    Object.keys(warnSum).forEach(key => {
                        const item = warnSum[key];
                        if (item && item.code) activeBadges.push(renderWarningBadge(item.code, item.name || key));
                        else if (item && item.actionCode === "ISSUE") activeBadges.push(renderWarningBadge(key, key));
                    });
                }

                if (activeBadges.length === 0 && rhrEn.warningMessage && rhrEn.warningMessage.length > 0) {
                    const msg = rhrEn.warningMessage.join(' ');
                    if (msg.includes('Yellow Fire')) activeBadges.push(renderWarningBadge('WFIREY', 'Yellow Fire'));
                    if (msg.includes('Red Fire')) activeBadges.push(renderWarningBadge('WFIRER', 'Red Fire'));
                    if (msg.includes('Amber Rainstorm')) activeBadges.push(renderWarningBadge('WRAINA', 'Amber Rain'));
                    if (msg.includes('Red Rainstorm')) activeBadges.push(renderWarningBadge('WRAINR', 'Red Rain'));
                    if (msg.includes('Black Rainstorm')) activeBadges.push(renderWarningBadge('WRAINB', 'Black Rain'));
                    if (msg.includes('Thunderstorm')) activeBadges.push(renderWarningBadge('WTS', 'Thunderstorm'));
                    if (msg.includes('Standby Signal')) activeBadges.push(renderWarningBadge('TC1', 'T1 Standby'));
                    if (msg.includes('Strong Wind Signal')) activeBadges.push(renderWarningBadge('TC3', 'TC3 Strong Wind'));
                    if (msg.includes('Very Hot')) activeBadges.push(renderWarningBadge('WHOT', 'Very Hot'));
                    if (msg.includes('Cold Weather')) activeBadges.push(renderWarningBadge('WCOLD', 'Cold Weather'));
                }

                if (activeBadges.length > 0) {
                    alertContainer.classList.add('has-warning');
                    alertIconsList.innerHTML = activeBadges.join('');
                } else {
                    alertContainer.classList.remove('has-warning');
                    alertIconsList.innerHTML = `<div class="flex items-center gap-1.5 text-slate-400 text-xs font-normal bg-slate-800/60 px-2.5 py-1 rounded-lg border border-slate-700/50 whitespace-nowrap"><i class="fa-solid fa-shield-halved text-emerald-400 text-xs"></i><span>No active warnings</span></div>`;
                }

                // --- 3. Forecast Cards (12:00 Today, 18:00 Tonight, 08:00 Tomorrow) ---
                const cardAft = document.getElementById('card-aft');
                if (currentHour >= 12) {
                    cardAft.classList.add('opacity-0', 'pointer-events-none');
                } else {
                    cardAft.classList.remove('opacity-0', 'pointer-events-none');
                    const m12 = getSlotData(12, '00', 0);
                    document.getElementById('f1-temp').textContent = `${m12.temp}°C`;
                    document.getElementById('f1-rh').textContent = `${m12.rh}% RH`;
                    document.getElementById('f1-psr').textContent = `${m12.pop}%`;
                    document.getElementById('f1-icon').className = `fa-solid ${getWmoIcon(m12.wmoCode, false)} text-xl md:text-2xl drop-shadow`;
                }

                const cardNight = document.getElementById('card-night');
                if (currentHour >= 18) {
                    cardNight.classList.add('opacity-0', 'pointer-events-none');
                } else {
                    cardNight.classList.remove('opacity-0', 'pointer-events-none');
                    const m18 = getSlotData(18, '00', 0);
                    document.getElementById('f2-temp').textContent = `${m18.temp}°C`;
                    document.getElementById('f2-rh').textContent = `${m18.rh}% RH`;
                    document.getElementById('f2-psr').textContent = `${m18.pop}%`;
                    document.getElementById('f2-icon').className = `fa-solid ${getWmoIcon(m18.wmoCode, true)} text-xl md:text-2xl drop-shadow`;
                }

                const mTmr8 = getSlotData(8, '00', 1);
                document.getElementById('f3-temp').textContent = `${mTmr8.temp}°C`;
                document.getElementById('f3-rh').textContent = `${mTmr8.rh}% RH`;
                document.getElementById('f3-psr').textContent = `${mTmr8.pop}%`;
                document.getElementById('f3-icon').className = `fa-solid ${getWmoIcon(mTmr8.wmoCode, false)} text-xl md:text-2xl drop-shadow`;

                syncStatusEl.textContent = `Upd ${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Hong_Kong' })}`;
            } catch (error) {
                console.error("Failed to fetch weather data:", error);
                syncStatusEl.textContent = 'Weather err';
            }
        }

        // Initialize dynamic font scaling (100% - 250%) on load
        applyEventTextSize();

        // Initial fetch + auto-refresh weather every 5 minutes and calendar embed every 15 minutes
        fetchWeatherData();
        setInterval(fetchWeatherData, 5 * 60 * 1000);
        setInterval(refreshEmbedCalendar, 15 * 60 * 1000);

        // Keep tablet screen awake using Screen Wake Lock API
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
        document.addEventListener('click', requestWakeLock, { once: true });
        requestWakeLock();
    </script>
